# EXAMPLE workflow: copy into .github/workflows/ of your own repo to use.
# Runs a Bicep what-if on pull requests and deploys on merge to main,
# using GitHub OIDC federated credentials. No secrets stored as passwords.
#
# One-time setup:
#   1. Create an Entra app registration (or user-assigned managed identity)
#   2. Add a federated credential for this repo (entity: pull_request and branch main)
#   3. Grant it Contributor on the target resource group
#   4. Add repo variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, RG_NAME
# Docs: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
name: foundry-private-deploy

on:
  pull_request:
    paths: ["iac/bicep/foundry-private/**"]
  push:
    branches: [main]
    paths: ["iac/bicep/foundry-private/**"]

permissions:
  id-token: write   # needed for OIDC
  contents: read
  pull-requests: write

jobs:
  what-if:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.RG_NAME }}" \
            --template-file iac/bicep/foundry-private/main.bicep \
            --parameters iac/bicep/foundry-private/main.bicepparam \
            --no-pretty-print > whatif.json
          echo "### Bicep what-if" >> "$GITHUB_STEP_SUMMARY"
          az deployment group what-if \
            --resource-group "${{ vars.RG_NAME }}" \
            --template-file iac/bicep/foundry-private/main.bicep \
            --parameters iac/bicep/foundry-private/main.bicepparam >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production   # add required reviewers on this environment
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        run: |
          az deployment group create \
            --resource-group "${{ vars.RG_NAME }}" \
            --template-file iac/bicep/foundry-private/main.bicep \
            --parameters iac/bicep/foundry-private/main.bicepparam
