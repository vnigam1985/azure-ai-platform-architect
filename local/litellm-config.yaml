# Week 0 local AI gateway: LiteLLM proxy in front of Ollama.
# It teaches the same ideas as Azure API Management in week 4:
#   one front door, a key per team, rate limits, and fallbacks.
# Docs: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # What apps ask for ("gpt-4.1-mini") is decoupled from what serves it.
  # In Azure, the same name will point at a Foundry deployment.
  - model_name: gpt-4.1-mini
    litellm_params:
      model: ollama_chat/qwen2.5:3b
      api_base: http://ollama:11434
      rpm: 30          # requests per minute this backend may take
      tpm: 20000       # tokens per minute this backend may take

  # A fake backend that never calls a model. Handy for testing the gateway itself.
  - model_name: mock
    litellm_params:
      model: openai/mock
      api_key: not-used
      mock_response: "This is a mock answer from the local gateway."

general_settings:
  # The admin key. Only you use it, to create per-team keys (make local-keys).
  # Apps get their own team key with its own limits. In Azure, team keys become
  # APIM subscriptions. Set in compose.yml; change it if you expose the gateway.
  master_key: os.environ/LITELLM_MASTER_KEY
  # Team keys live in Postgres (DATABASE_URL in compose.yml).
  database_url: os.environ/DATABASE_URL

router_settings:
  # If the main backend fails, try the mock one so you can watch a fallback happen.
  fallbacks:
    - gpt-4.1-mini: ["mock"]
